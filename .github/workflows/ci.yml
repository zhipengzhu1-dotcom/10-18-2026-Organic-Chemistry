name: CI

on:
  pull_request:
  push:
    branches: [main, research/3d-rendering, feat/astratron-v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check: make "test" a required status check in branch protection so red blocks merge.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Content build
        run: pnpm content:build
      - name: Chemistry-number lint (Scene code reads numbers from cited data)
        run: pnpm lint:numbers
      - name: Scene purity lint (no timers, frame hooks, CSS animation or unseeded randomness)
        run: pnpm lint:scenes
      - name: Blender renders are current (re-hashes each render's recorded inputs; Blender is not installed here)
        run: pnpm blender check
      - name: Unit tests (content build + Step player engine)
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (smoke, design system, axe on every page in both themes)
        run: pnpm test:e2e
      - name: First-load JS budget (at most 200 KB compressed per Lesson page; 3D and meshes load lazily)
        run: pnpm budget:js
      - name: The site ships no Remotion code (checks the site/dist the smoke test built)
        run: pnpm video check-site
      - name: Video path (one frame of every Scene at 16:9 and 9:16 through Remotion)
        run: pnpm video stills
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Build-time Python pipelines: fast unit tests only (no PySCF runs; their results are committed).
  pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Pipeline unit tests
        working-directory: pipelines
        run: uv run --group compute pytest -q
