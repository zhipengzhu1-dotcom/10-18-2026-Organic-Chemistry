<!--
  PROTOTYPE, throwaway. Wayfinder ticket "Prototype: Specify Lesson 6: Resonance: Pushing Electrons (pilot)" (#30).
  Plays every Step of the Lesson 6 spec (docs/specs/unit-1/lesson-06-resonance.md, PR #39) as one rough, clickable Lesson:
  Hook → 9 Build Steps → 4 Check Problems → Wrap → Lesson-end screen.
  Draw-arrows Steps use the push-live interaction that won "Prototype: curved-arrow mechanism interaction" (#14):
  grab the electrons, drop them on an atom, each push graded on the spot by running it and comparing the product.
  The floating bar jumps between Steps, shows the spec fields for the current Step (?spec=1), and toggles reduced motion.
  Bond lengths are pasted from lesson-06-geometry/*.json (PySCF B3LYP/cc-pVTZ run on 2026-10-18), never typed by hand.

<body>
<div id="app"></div>
<div id="bar" role="toolbar" aria-label="Prototype controls">
  <span class="tag">PROTOTYPE</span>
  <button id="b-prev" aria-label="Previous Step">←</button>
  <select id="b-step" aria-label="Jump to Step"></select>
  <button id="b-next" aria-label="Next Step">→</button>
  <button id="b-spec" aria-pressed="false">spec</button>
  <button id="b-motion" aria-pressed="false">reduced motion</button>
  <button id="b-reset">redo Step</button>
  <button id="b-about">?</button>
</div>
<pre id="spec" aria-label="Spec fields for this Step"></pre>
<div id="live" class="sr" aria-live="polite"></div>

<script>
// =====================================================================
// Resonance push engine: pure functions over a plain molecule state.
// state = {bonds:{'a-b':order}, lp:{atom:count}, ch:{atom:charge}}; atoms and σ bonds never change.
// A push is {from:{lp:atom} | {bond:[a,b]}, to:atom}; its key is 'lp4>2' or 'b2-3>3'.
// The three moves (spec, "How resonance works in push-live"):
//   1 lone pair → neighbouring atom  = new π bond
//   2 bond → one of its own atoms    = lone pair there
//   3 bond → atom next to the bond   = the bond moves to sit between the shared atom and that atom
// =====================================================================
const bk=(a,b)=>a<b?`${a}-${b}`:`${b}-${a}`;
const clone=o=>JSON.parse(JSON.stringify(o));
const keyOf=p=>(p.from.lp?`lp${p.from.lp}`:`b${bk(...p.from.bond)}`)+'>'+p.to;
function parseKey(k){
  const m=k.match(/^(lp(\d+)|b(\d+)-(\d+))>(\d+)$/);
  return m[2]?{from:{lp:+m[2]},to:+m[5]}:{from:{bond:[+m[3],+m[4]]},to:+m[5]};
}
function neighbours(s,a){
  const out=[]; for(const k in s.bonds){const [x,y]=k.split('-').map(Number); if(x===a)out.push(y); else if(y===a)out.push(x);} return out;
}
function applyPush(s0,p){
  const s=clone(s0), ch=(a,d)=>{s.ch[a]=(s.ch[a]||0)+d; if(!s.ch[a]) delete s.ch[a];};
  const bump=(a,b,d)=>{s.bonds[bk(a,b)]=(s.bonds[bk(a,b)]||0)+d;};
  const t=p.to;
  if(p.from.lp){
    const a=p.from.lp; s.lp[a]--; bump(a,t,1); ch(a,1); ch(t,-1);
  }else{
    const [a,b]=p.from.bond; bump(a,b,-1);
    if(t===a||t===b){const o=t===a?b:a; s.lp[t]=(s.lp[t]||0)+1; ch(t,-1); ch(o,1);}
    else{const n=neighbours(s0,a).includes(t)?a:b, o=n===a?b:a; bump(n,t,1); ch(o,1); ch(t,-1);}
  }
  return s;
}
const applyAll=(start,keys)=>keys.reduce((s,k)=>applyPush(s,parseKey(k)),start);
// Is this push even a legal resonance move? (σ bonds can be grabbed, so their Hint can fire, but never move.)
function legality(s,p){
  if(p.from.lp){ if(!(s.lp[p.from.lp]>0)) return 'no lone pair'; if(!neighbours(s,p.from.lp).includes(p.to)) return 'not a neighbour'; return 'ok'; }
  const [a,b]=p.from.bond, order=s.bonds[bk(a,b)];
  if(order<2) return 'sigma';
  if(p.to===a||p.to===b) return 'ok';
  if(neighbours(s,a).includes(p.to)||neighbours(s,b).includes(p.to)) return 'ok';
  return 'not a neighbour';
}
function electrons(mol,s,a){
  let n=2*(mol.atoms[a].h||0); for(const k in s.bonds){const [x,y]=k.split('-').map(Number); if(x===a||y===a) n+=2*s.bonds[k];}
  return n+2*(s.lp[a]||0);
}
const octet=(mol,a)=>mol.atoms[a].el==='H'?2:8;
function canon(s){
  const lp={},ch={}; for(const a in s.lp) if(s.lp[a]) lp[a]=s.lp[a]; for(const a in s.ch) if(s.ch[a]) ch[a]=s.ch[a];
  return JSON.stringify([Object.entries(s.bonds).sort(),Object.entries(lp).sort(),Object.entries(ch).sort()]);
}
// Grade one push live: accepted if it belongs to a push set (any order) consistent with the pushes already made.
function gradePush(step,doneKeys,key){
  for(const path of step.paths) if(path.includes(key)&&!doneKeys.includes(key)&&doneKeys.every(k=>path.includes(k))) return true;
  return false;
}
function pickHint(step,key,info){
  for(const [test,text] of step.hints){
    if(typeof test==='string'?test===key:test instanceof RegExp?test.test(key):test(key,info)) return text;
  }
  return step.fallback;
}

// =====================================================================
// Molecules. 2D schematic positions in SVG units (no geometry shown to the Student, so nothing measured is used).
// lbl: the letters drawn ('' = a line-angle vertex). h: implicit H's (counted for the octet, drawn inside lbl).
// =====================================================================
const MOLS={
  formaldehyde:{atoms:{1:{el:'C',lbl:'C',x:175,y:130,name:'C'},2:{el:'O',lbl:'O',x:265,y:130,name:'O'},3:{el:'H',lbl:'H',x:122,y:84,name:'top H'},4:{el:'H',lbl:'H',x:122,y:176,name:'bottom H'}},
    start:{bonds:{'1-2':2,'1-3':1,'1-4':1},lp:{2:2},ch:{}}},
  nitromethane:{atoms:{1:{el:'C',lbl:'C',x:130,y:130,name:'C'},2:{el:'N',lbl:'N',x:215,y:130,name:'N'},3:{el:'O',lbl:'O',x:272,y:70,name:'top O'},4:{el:'O',lbl:'O',x:272,y:190,name:'bottom O'},
    5:{el:'H',lbl:'H',x:130,y:70,name:'top H'},6:{el:'H',lbl:'H',x:72,y:130,name:'left H'},7:{el:'H',lbl:'H',x:130,y:190,name:'bottom H'}},
    start:{bonds:{'1-2':1,'2-3':2,'2-4':1,'1-5':1,'1-6':1,'1-7':1},lp:{3:2,4:3},ch:{2:1,4:-1}}},
  acetate:{atoms:{1:{el:'C',lbl:'H₃C',h:3,x:108,y:150,name:'CH₃'},2:{el:'C',lbl:'C',x:198,y:150,name:'C'},3:{el:'O',lbl:'O',x:256,y:84,name:'top O'},4:{el:'O',lbl:'O',x:256,y:216,name:'bottom O'}},
    start:{bonds:{'1-2':1,'2-3':2,'2-4':1},lp:{3:2,4:3},ch:{4:-1}}},
  aceticAcid:{atoms:{1:{el:'C',lbl:'H₃C',h:3,x:108,y:150,name:'CH₃'},2:{el:'C',lbl:'C',x:198,y:150,name:'C'},3:{el:'O',lbl:'O',x:256,y:84,name:'top O'},4:{el:'O',lbl:'OH',h:1,x:262,y:216,name:'OH'}},
    start:{bonds:{'1-2':1,'2-3':2,'2-4':1},lp:{3:2,4:2},ch:{}}},
  allyl:{atoms:{1:{el:'C',lbl:'H₂C',h:2,x:100,y:176,name:'C1'},2:{el:'C',lbl:'CH',h:1,x:200,y:112,name:'C2'},3:{el:'C',lbl:'CH₂',h:2,x:300,y:176,name:'C3'}},
    start:{bonds:{'1-2':2,'2-3':1},lp:{},ch:{3:1}}},
  ozone:{atoms:{1:{el:'O',lbl:'O',x:110,y:176,name:'left O'},2:{el:'O',lbl:'O',x:200,y:116,name:'central O'},3:{el:'O',lbl:'O',x:290,y:176,name:'right O'}},
    start:{bonds:{'1-2':2,'2-3':1},lp:{1:2,2:1,3:3},ch:{2:1,3:-1}}},
  methylNitrite:{atoms:{1:{el:'C',lbl:'H₃C',h:3,x:80,y:160,name:'CH₃'},2:{el:'O',lbl:'O',x:155,y:110,name:'O'},3:{el:'N',lbl:'N',x:235,y:160,name:'N'},4:{el:'O',lbl:'O',x:315,y:110,name:'O'}},
    start:{bonds:{'1-2':1,'2-3':1,'3-4':2},lp:{2:2,3:1,4:2},ch:{}}},
  oxo:{atoms:{6:{el:'O',lbl:'O',x:200,y:58,name:'O'},5:{el:'C',lbl:'CH',h:1,x:266,y:96,name:'C5'},4:{el:'C',lbl:'CH',h:1,x:266,y:172,name:'C4'},
    3:{el:'C',lbl:'CH',h:1,x:200,y:210,name:'C3'},2:{el:'C',lbl:'',h:2,x:134,y:172,name:'C2'},1:{el:'C',lbl:'',h:2,x:134,y:96,name:'C1'}},
    start:{bonds:{'1-2':1,'2-3':1,'3-4':1,'4-5':2,'5-6':1,'1-6':1},lp:{6:2},ch:{3:1}}},
  thio:{atoms:{1:{el:'C',lbl:'',h:3,x:62,y:180,name:'C1'},2:{el:'C',lbl:'C',x:132,y:140,name:'C2'},3:{el:'S',lbl:'S',x:132,y:62,name:'S'},
    4:{el:'C',lbl:'CH',h:1,x:204,y:180,name:'C4'},5:{el:'C',lbl:'CH',h:1,x:274,y:140,name:'C5'},6:{el:'C',lbl:'CH₂',h:2,x:346,y:180,name:'C6'}},
    start:{bonds:{'1-2':1,'2-3':2,'2-4':1,'4-5':2,'5-6':1},lp:{3:2,6:1},ch:{6:-1}}},
};

// =====================================================================
// Drawing (SVG strings)
// =====================================================================
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const lerp=(a,b,u)=>a+(b-a)*u;
const angDiff=(a,b)=>{let d=Math.abs(a-b)%(2*Math.PI);return d>Math.PI?2*Math.PI-d:d;};
function atomR(at,ang){ if(!at.lbl) return 0; if(at.lbl.length===1) return at.el==='H'?9:12; return Math.abs(Math.cos(ang))*20+Math.abs(Math.sin(ang))*11; }
// Place a charge and the lone pairs around an atom in the emptiest directions.
function layout(mol,s,a){
  const at=mol.atoms[a], occ=neighbours(s,a).map(b=>Math.atan2(mol.atoms[b].y-at.y,mol.atoms[b].x-at.x));
  if(at.lbl&&at.lbl.length>1){occ.push(0,Math.PI);}

function check(){

  st.tries++;

// ---------- Tap to identify ----------

    for(const k in s.bonds){const [a,b]=k.split('-').map(Number);hits+=`<circle class="hit" tabindex="0" role="button" aria-pressed="${st.sel.has('b'+k)}" aria-label="${A[a].name}–${A[b].name} ${s.bonds[k]>1?'double ':''}bond" data-t="b${k}" cx="${(A[a].x+A[b].x)/2}" cy="${(A[a].y+A[b].y)/2}" r="12"/>`;}
  }

  const pick=el=>{const t=el.dataset.t;st.sel.has(t)?st.sel.delete(t):st.sel.add(t);bodyTap();drawMain();renderSpec();$(`[data-t="${t}"]`)?.focus();};

// ---------- Draw arrows (push live) ----------
function bodyArrows(){
  const S=cur(), m=MOLS[S.mol];
  $('#body').innerHTML=`${S.showTarget?`<div class="target"><span>TARGET</span><svg viewBox="${vb(m,36)}" role="img" aria-label="Target contributor">${molSvg(m,st.target,{op:.85})}</svg></div>`:
      `<div class="target"><span>OPEN PROBLEM · ANY VALID CONTRIBUTOR</span></div>`}
    <div class="card"><div class="callout" id="call" aria-hidden="true"></div>
    <svg class="mol" id="mol" viewBox="${vb(m)}" role="group" aria-label="Starting structure. Use Tab to pick electrons, Enter to select."></svg>
    <div class="tools" id="tools"></div><div class="cap" id="cap" hidden></div></div>`;
  const svg=$('#mol');
  svg.addEventListener('pointerdown',down); svg.addEventListener('pointermove',move); svg.addEventListener('pointerup',up);
  svg.addEventListener('pointercancel',()=>{st.drag=null;drawArrows();}); svg.addEventListener('keydown',key);

function sources(mol,s){
  const A=mol.atoms,out=[];
  for(const a in A){const L=layout(mol,s,+a); if(L.lps.length){const ang=L.lps[L.lps.length-1],p=lpPos(A[a],ang);out.push({kind:'lp',atom:+a,x:p.x,y:p.y,label:`lone pair on ${A[a].name}`,lps:L.lps.map(t=>lpPos(A[a],t))});}}
  for(const k in s.bonds){const [a,b]=k.split('-').map(Number);out.push({kind:'bond',a,b,k,x:(A[a].x+A[b].x)/2,y:(A[a].y+A[b].y)/2,label:`${A[a].name}–${A[b].name} ${s.bonds[k]>1?'π':'σ'} bond`});}
  return out;
}
// Drop targets sit where each move's arrowhead is drawn, plus the receiving atom itself:
//   lone pair on X → the X–Y bond (move 1) · π bond → beside one of its own atoms (move 2) · π bond → the next bond (move 3)
function dropTargets(mol,s,src){
  const A=mol.atoms, mid=(a,b)=>({x:(A[a].x+A[b].x)/2,y:(A[a].y+A[b].y)/2}), out=[], heavy=t=>A[t].el!=='H';
  if(src.kind==='lp'){for(const y of neighbours(s,src.atom)) if(heavy(y)){out.push({to:y,pt:mid(src.atom,y),spot:true},{to:y,pt:A[y]});}}
  else{
    const {a,b}=src;
    for(const t of [a,b]) if(heavy(t)) out.push({to:t,pt:pushGeom(mol,s,{from:{bond:[a,b]},to:t}).p1,spot:true},{to:t,pt:A[t]});
    for(const [n,o2] of [[a,b],[b,a]]) for(const t of neighbours(s,n)) if(t!==o2&&heavy(t)) out.push({to:t,pt:mid(n,t),spot:true},{to:t,pt:A[t]});
  }

}
const sinks=(mol,s,src)=>[...new Set(dropTargets(mol,s,src).map(d=>d.to))];
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,u=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));return Math.hypot(p.x-a.x-u*dx,p.y-a.y-u*dy);}
function nearestSource(p){
  const m=MOLS[cur().mol]; let best=null,bd=1e9;
  for(const s of sources(m,curState())){
    const d=s.kind==='lp'?Math.min(...s.lps.map(q=>dist(p,q))):segDist(p,m.atoms[s.a],m.atoms[s.b]);
    if(d<(s.kind==='lp'?20:17)&&d<bd){bd=d;best=s;}

}
function nearestSink(p,src){const m=MOLS[cur().mol];let best=null,bd=30;for(const t of dropTargets(m,curState(),src)){const d=dist(p,t.pt)-(t.spot?4:0);if(d<bd){bd=d;best=t.to;}}return best;}
const pushFrom=(src,to)=>({from:src.kind==='lp'?{lp:src.atom}:{bond:[src.a,src.b]},to});
function describe(p){const A=MOLS[cur().mol].atoms;return (p.from.lp?`lone pair on ${A[p.from.lp].name}`:`${A[p.from.bond[0]].name}–${A[p.from.bond[1]].name} bond`)+` → ${A[p.to].name}`;}

function drawArrows(){
  const S=cur(), m=MOLS[S.mol], svg=$('#mol'); if(!svg) return;
  if(st.scene){svg.innerHTML=replayFrame(m,st.done,st.t);$('#tools').innerHTML=scrubber();wireScrub(drawArrows);
    $('#cap').hidden=false;$('#cap').innerHTML=`Scene <span class="data">push-replay</span>. ${S.sr}`;drawFb();drawMain();renderSpec();return;}
  const s=curState(), focusId=document.activeElement&&document.activeElement.dataset?(document.activeElement.dataset.src||document.activeElement.dataset.sink):null;
  const grabbing=st.drag?st.drag.src:st.armed;
  // in-between flags: only on a halfway state the spec calls not real; ring the atoms whose count is off
  const f0=st.phase!=='done'&&st.done.length?(typeof S.between==='function'?S.between(m,s):S.between&&S.between[st.done[0]]):null;
  const flag=new Set(f0&&f0[1]?Object.keys(m.atoms).map(Number).filter(a=>m.atoms[a].el!=='H'&&(electrons(m,s,a)>octet(m,a)||(electrons(m,s,a)<8&&electrons(m,s,a)!==electrons(m,m.start,a)))):[]);
  let o=molSvg(m,s,{flag,grab:grabbing&&grabbing.kind==='bond'?grabbing.k:null,hideLp:st.drag&&st.drag.src.kind==='lp'?st.drag.src.atom:null});
  // accepted pushes stay as a faint trail, drawn on the state each was applied to
  st.done.forEach((k,i)=>{o+=arrowSvg(pushGeom(m,applyAll(m.start,st.done.slice(0,i)),parseKey(k)),st.shown.includes(k)?'var(--at-ignite)':'var(--at-electron)',{op:.4});});
  if(st.bounce){const g=pushGeom(m,s,st.bounce);o+=arrowSvg(g,'var(--at-ignite)',{dashed:true,cls:'bounce'})+`<text x="${g.c.x}" y="${g.c.y-6}" text-anchor="middle" font-size="18" font-weight="700" fill="var(--at-ignite)" font-family="JetBrains Mono,monospace">✕</text>`;}
  if(grabbing){

      o+=`<circle cx="${t.pt.x}" cy="${t.pt.y}" r="12" fill="${snap?'color-mix(in srgb,var(--at-electron) 30%,transparent)':'none'}" stroke="var(--at-electron)" stroke-width="${snap?3:1.8}" stroke-dasharray="${snap?'0':'3 3'}" opacity="${snap?1:.8}"/>`;}
    if(st.drag){
      const end=st.drag.snap?pushGeom(m,s,pushFrom(grabbing,st.drag.snap)):arrowGeom(m,{x:grabbing.x,y:grabbing.y},st.drag.p);
      o+=arrowSvg(end,'var(--at-electron)',{dashed:!st.drag.snap,noHead:!st.drag.snap});
      const p=st.drag.p; o+=`<circle cx="${p.x-4}" cy="${p.y}" r="4" fill="var(--at-electron)"/><circle cx="${p.x+4}" cy="${p.y}" r="4" fill="var(--at-electron)"/>`;
    }
  }
  if(st.phase!=='done'){
    if(st.armed) for(const a of sinks(m,s,st.armed)) o+=`<circle class="hit" tabindex="0" role="button" data-sink="${a}" aria-label="Send the ${st.armed.label} to ${m.atoms[a].name}" cx="${m.atoms[a].x}" cy="${m.atoms[a].y}" r="24"/>`;
    else for(const q of sources(m,s)) o+=`<circle class="hit" tabindex="0" role="button" data-src="${q.kind==='lp'?'lp'+q.atom:'b'+q.k}" aria-label="Grab the ${q.label}" cx="${q.x}" cy="${q.y}" r="${q.kind==='lp'?11:9}"/>`;
  }
  svg.innerHTML=o;
  if(focusId){const el=svg.querySelector(`[data-src="${focusId}"],[data-sink="${focusId}"]`);(el||svg.querySelector('.hit'))?.focus();}
  // callout: what the finger is doing, else the in-between flag
  let txt=st.call,warn=st.callWarn;
  if(st.drag) txt=st.drag.snap?`${st.drag.src.label} → ${m.atoms[st.drag.snap].name}`:`${st.drag.src.label} → …`;
  else if(st.armed) txt=`${st.armed.label} → pick where it goes`;
  else if(!txt&&st.done.length&&st.phase!=='done'){
    if(f0){txt=f0[0];warn=f0[1];}
  }
  const c=$('#call'); c.textContent=txt||''; c.className='callout'+(warn?' warn':'');
  const n=st.done.length, total=S.paths[0].length;
  $('#tools').innerHTML=`<span class="muted">${n} of ${total} push${total>1?'es':''} · try ${Math.min(st.tries+1,2)} of 2 on this push</span>`+
    (st.phase==='done'?`<button class="ibtn" id="replay">▶ REPLAY</button>`:'');
  if($('#replay')) $('#replay').onclick=()=>startReplay();
  $('#cap').hidden=true;
  drawFb(); drawMain(); renderSpec();
}
function pt(e){const svg=$('#mol'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function down(e){
  if(st.phase==='done'||st.scene) return;
  const p=pt(e); st.call=''; st.callWarn=false;
  const s=nearestSource(p);
  if(!s){const m=MOLS[cur().mol],near=Object.keys(m.atoms).find(a=>dist(p,m.atoms[a])<24);
    if(near){st.call=`${m.atoms[near].name} itself isn't electrons. Start at a lone pair or a bond.`;st.callWarn=true;}
    drawArrows();return;}
  st.drag={src:s,p,snap:null,moved:false}; $('#mol').setPointerCapture(e.pointerId); drawArrows();

function move(e){if(!st.drag)return;const p=pt(e);st.drag.p=p;st.drag.moved=true;st.drag.snap=nearestSink(p,st.drag.src);drawArrows();}
function up(){
  if(!st.drag) return; const d=st.drag; st.drag=null;

  else if(!d.moved){st.call=`Drag the ${d.src.label} onto one of the dashed spots.`;}

}
function key(e){
  const el=e.target, m=MOLS[cur().mol];
  if(e.key==='Escape'&&st.armed){st.armed=null;drawArrows();return;}
  if(e.key!=='Enter'&&e.key!==' ') return; if(!el.dataset||st.phase==='done') return;
  e.preventDefault();
  if(el.dataset.src){const id=el.dataset.src;st.armed=sources(m,curState()).find(q=>(q.kind==='lp'?'lp'+q.atom:'b'+q.k)===id);say(`Grabbed the ${st.armed.label}. Tab to an atom and press Enter, or Escape to cancel.`);drawArrows();$('#mol').querySelector('[data-sink]')?.focus();}
  else if(el.dataset.sink){const p=pushFrom(st.armed,+el.dataset.sink);st.armed=null;commit(p);drawArrows();$('#mol').querySelector('.hit')?.focus();}
}
function commit(p){
  const S=cur(), s=curState(), k=keyOf(p), leg=legality(s,p);
  if(leg==='ok'&&gradePush(S,st.done,k)){
    st.done.push(k); st.tries=0; st.msg=null; st.call=''; say(`Push accepted: ${describe(p)}.`);
    if(canon(curState())===canon(st.target)) succeed(false);
    return;
  }
  st.tries++; st.lastHint=pickHint(S,k,{sigma:leg==='sigma'});
  st.bounce=p; setTimeout(()=>{st.bounce=null;drawArrows();},reduced?900:650);
  if(st.tries<2){st.msg={kind:'hint',title:'NOT QUITE',text:st.lastHint};say('Not quite. '+st.lastHint);return;}
  // second miss on this push: show it in orange, apply it, carry on
  const path=S.paths.find(pa=>st.done.every(x=>pa.includes(x))), next=path.find(x=>!st.done.includes(x));
  st.done.push(next); st.shown.push(next); st.tries=0;
  if(canon(curState())===canon(st.target)){succeed(true);return;}
  st.msg={kind:'show',title:'HERE IS THAT PUSH',text:`${st.lastHint} The push is shown in orange: ${describe(parseKey(next))}. Now finish it.`}; say(st.msg.text);
}
function succeed(revealed){
  const S=cur(); st.phase='done';
  st.msg=revealed?{kind:'show',title:'HERE IS THE ANSWER',text:S.correct}:{kind:'good',title:'ELECTRONS PUSHED!',text:S.correct};
  say((revealed?'Here is the answer. ':'Correct. ')+S.correct);
  if(!reduced) setTimeout(()=>{if(st.phase==='done'&&cur()===S) startReplay();},800);
}
function startReplay(){st.scene=true;st.t=0;if(reduced){st.t=1;drawArrows();}else play(drawArrows,st.done.length);}

// =====================================================================
// Scenes: pure functions of t ∈ [0,1]
// =====================================================================
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
// push-replay: electrons ride each arrow in turn, then bonds and charges update.
function replayFrame(mol,pushes,t){
  const n=pushes.length; if(!n) return molSvg(mol,mol.start);
  const seg=Math.min(n-1,Math.floor(t*n)), u=ease(t*n-seg);
  const before=applyAll(mol.start,pushes.slice(0,seg)), landed=u>=.999||t>=1;
  let o=molSvg(mol,landed&&seg===n-1?applyAll(mol.start,pushes):before);
  pushes.forEach((k,i)=>{ if(i>seg) return; const g=pushGeom(mol,applyAll(mol.start,pushes.slice(0,i)),parseKey(k));
    o+=arrowSvg(g,'var(--at-electron)',{op:i<seg?.35:1});
    if(i===seg&&u>0&&u<.999){const p=bez(g,u),q=bez(g,Math.min(1,u+.04)),ang=Math.atan2(q.y-p.y,q.x-p.x);
      o+=`<circle cx="${p.x-Math.sin(ang)*4}" cy="${p.y+Math.cos(ang)*4}" r="4" fill="var(--at-electron)"/><circle cx="${p.x+Math.sin(ang)*4}" cy="${p.y-Math.cos(ang)*4}" r="4" fill="var(--at-electron)"/>`;}
  });
  return o;
}
function scrubber(){return `<div class="scrub"><button class="ibtn" id="play" aria-label="${st.playing?'Pause':'Play'} the Scene">${st.playing?'❚❚':'▶'}</button><input type="range" id="t" min="0" max="1000" value="${Math.round(st.t*1000)}" aria-label="Scene time"></div>`;}
let replayN=1;
function wireScrub(redraw){
  const pb=$('#play'), r=$('#t'); if(!pb) return;
  pb.onclick=()=>{if(st.playing){st.playing=false;cancelAnimationFrame(raf);redraw();}else{if(st.t>=1)st.t=0;play(redraw,replayN);}};
  r.oninput=e=>{st.playing=false;cancelAnimationFrame(raf);st.t=e.target.value/1000;redraw();};
}
function play(redraw,n){
  replayN=n; st.playing=true; const D=1300*n, t0=performance.now()-st.t*D;
  const tick=now=>{st.t=Math.min(1,(now-t0)/D);if(st.t>=1)st.playing=false;redraw();if(st.playing)raf=requestAnimationFrame(tick);};
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
// Bond lengths from lesson-06-geometry/*.json (PySCF B3LYP/cc-pVTZ). Pasted from the pipeline output, never typed by hand.
const GEOM=/*GEOM*/{"acid": {"double": 1.2029, "single": 1.3565}, "anion": {"a": 1.2515, "b": 1.2524}, "from": "lesson-06-geometry/acetic-acid.json, acetate-eclipsed.json (PySCF 2.14.0, B3LYP/cc-pVTZ, gas phase, true minima)"}/*END*/;
// Shown to 2 decimals: the methyl rotor is free (barrier 0.026 kcal/mol), so a 0.001 Å split at one frozen orientation isn't real.
const len=v=>GEOM?`${v.toFixed(2)} Å`:'?.??? Å';
// acetate-bond-lengths: acetic acid vs acetate.
function sceneBondLengths(){
  const sc=(mol,x0,lab)=>{const m=MOLS[mol];return `<g transform="translate(${x0},20) scale(.5)">${molSvg(m,m.start)}</g>`+lab;};
  const L=(x,y,t,c='var(--at-ignite)')=>`<text x="${x}" y="${y}" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="${c}">${t}</text>`;
  return `<text x="100" y="22" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="14" fill="#fff">acetic acid</text>`+
    `<text x="300" y="22" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="14" fill="#fff">acetate</text>`+
    sc('aceticAcid',0,L(138,62,'C=O '+len(GEOM&&GEOM.acid.double))+L(138,150,'C–O '+len(GEOM&&GEOM.acid.single))+L(30,200,'differ: C=O shorter',"var(--at-ink-muted)"))+
    sc('acetate',200,L(338,62,len(GEOM&&GEOM.anion.a),'var(--at-electron)')+L(338,150,len(GEOM&&GEOM.anion.b),'var(--at-electron)')+L(230,200,'identical',"var(--at-electron)"))+
    `<line x1="200" y1="36" x2="200" y2="215" stroke="var(--at-line)" stroke-dasharray="4 4"/>`+
    `<text x="200" y="245" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="var(--at-ink-muted)">computed · PySCF B3LYP/cc-pVTZ${GEOM?'':' · pending'}</text>`;
}
// three-moves: one panel per move, lit in turn.
function sceneThree(){
  const panel=(mol,keys,i,label)=>{const m=MOLS[mol],s=m.start,g=pushGeom(m,s,parseKey(keys[0]));
    return `<g class="panel" style="animation-delay:${i*1.5}s"><g transform="translate(${i*133},40) scale(.33)">${molSvg(m,s)}${arrowSvg(g,'var(--at-electron)')}</g>`+
      `<text x="${i*133+66}" y="150" text-anchor="middle" font-family="Silkscreen" font-size="11" fill="var(--at-electron)">MOVE ${i+1}</text>`+
      `<text x="${i*133+66}" y="168" text-anchor="middle" font-family="Space Grotesk" font-size="12" fill="#fff">${label}</text></g>`;};
  return panel('acetate',['lp4>2'],0,'lone pair → bond')+panel('formaldehyde',['b1-2>2'],1,'bond → atom')+panel('allyl',['b1-2>3'],2,'bond → next bond')+
    `<text x="200" y="215" text-anchor="middle" font-family="Space Grotesk" font-size="13" fill="var(--at-ink-muted)">atoms don't move · σ bonds don't break</text>`;
}
// acetate-hybrid: one drawing, dashed C–O bonds, δ− on each O, lone pairs hidden.
function sceneHybrid(){
  const m=MOLS.acetate, s={bonds:{'1-2':1,'2-3':1,'2-4':1},lp:{},ch:{}};
  return molSvg(m,s,{partial:['2-3','2-4'],delta:{3:'δ−',4:'δ−'},lpHidden:true})+
    `<text x="236" y="128" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="var(--at-electron)">${len(GEOM&&GEOM.anion.a)}</text>`+
    `<text x="236" y="186" font-family="JetBrains Mono,monospace" font-size="11" font-weight="600" fill="var(--at-electron)">${len(GEOM&&GEOM.anion.b)}</text>`+
    `<text x="200" y="250" text-anchor="middle" font-family="Space Grotesk" font-size="13" fill="var(--at-ink-muted)">the hybrid: charge shared, both bonds the same</text>`;
}

// ---------- intro + Lesson end ----------

  $('#app').innerHTML=`<main class="intro"><h1>Lesson 6, playable</h1>
  <p>A rough run-through of <b>every Step</b> in the Lesson 6 spec (<i>Resonance: Pushing Electrons</i>): the Hook, nine Build Steps, four Check Problems and the Wrap. The wording, answers, Hints and in-between flags are copied from the spec, so anything that reads wrong here reads wrong in the spec.</p>
  <div class="box"><b>Please look for</b><ol>
    <li><b>Pace.</b> Does 15 Steps feel right? Do the Explain Steps (2, 5, 7) land where you need them?</li>
    <li><b>Pushes.</b> On Steps 4, 6, 8 and 10, do the three moves feel natural to do with a finger, especially move 3 (drop a π bond on the next atom)?</li>
    <li><b>In-between flags.</b> When you make the first of two pushes, is the orange "not a real structure" note clear, or does it read like you did something wrong?</li>
    <li><b>Hints.</b> Make deliberate mistakes. Is each Hint the one a Student needs at that moment?</li>
    <li><b>The Check Problems.</b> Is the difficulty ramp (ozone ● → thio-dienyl ●●●) right? Ozone is graded as an open Problem (no target shown).</li>
    <li><b>The acetate story.</b> Does the Hook → Step 6 → Step 7 → Wrap arc pay off? The bond lengths are now real PySCF numbers.</li>
  </ol></div>
  <p class="muted">The yellow bar at the bottom is not part of the design: jump to any Step, open the spec fields, toggle reduced motion, or redo a Step.</p>
  <button class="btn btn-primary" onclick="go(0)">START THE LESSON</button></main>`;
}
function renderEnd(){
  $('#app').innerHTML=`<main class="step end"><div class="big" style="margin-top:10px">LESSON COMPLETE</div>
    <div class="key"><span class="muted">KEY IDEA</span><br>${KEY_IDEA}</div>
    <div class="streak">🔥 streak <b>+1</b> <span class="muted">(1 Lesson today)</span></div>
    <button class="btn btn-primary" disabled title="Not built in this prototype">NEXT LESSON: RESONANCE: WHICH CONTRIBUTOR WINS</button>
    <button class="btn btn-secondary" onclick="go(-1)">BACK TO UNIT</button></main>`;
}

// ---------- spec panel (prototype chrome) ----------
function renderSpec(){
  const d=$('#spec'); d.className=showSpec?'on':''; if(!showSpec||idx<0||idx>=STEPS.length){d.innerHTML='';return;}
  const S=cur(); let t=`<b>id</b> ${S.id}   <b>phase</b> ${S.phase}   <b>type</b> ${S.type}${S.prediction?' (prediction: true)':''}${S.multi?' (multi-correct)':''}\n`;
  if(S.diff) t+=`<b>difficulty</b> ${S.diff}   <b>source</b> ${S.problem}   <b>status</b> draft\n`;
  if(S.answer) t+=`<b>answer</b> {${S.answer.join(', ')}}   <b>picked</b> {${[...st.sel].join(', ')}}\n`;
  if(S.type==='arrows'){
    const m=MOLS[S.mol], s=curState();
    t+=`<b>accepted pushes</b> ${S.open?'(open: any valid contributor)':''}\n  ${S.paths.map(p=>p.join(' + ')).join('\n  ')}  (any order)\n`;
    t+=`<b>pushes made</b> ${st.done.join(', ')||'–'}${st.shown.length?`  (revealed: ${st.shown.join(', ')})`:''}\n`;
    t+=`<b>live state</b>\n  bonds   ${Object.entries(s.bonds).filter(([,v])=>v>1).map(([k,v])=>k.split('-').map(x=>m.atoms[x].name).join('=')).join(', ')||'no π bonds'}\n`;
    t+=`  charges ${Object.entries(s.ch).map(([a,v])=>m.atoms[a].name+(v>0?'+':'−')).join(', ')||'none'}\n`;
    t+=`  e⁻      ${Object.keys(m.atoms).filter(a=>m.atoms[a].el!=='H').map(a=>m.atoms[a].name+':'+electrons(m,s,+a)).join('  ')}\n`;
    t+=`<b>matches target</b> ${canon(s)===canon(st.target)}\n`;
  }
  if(S.hints) t+=`<b>Hints</b> (first match wins)\n${S.hints.map(([x,h])=>'  · '+(typeof x==='string'?x:x instanceof RegExp?String(x):'(rule)')+' → '+h).join('\n')}\n  · (fallback) → ${S.fallback}\n`;
  if(st.lastHint) t+=`<b>last Hint shown</b> ${st.lastHint}\n`;
  if(S.sr) t+=`<b>screen reader</b> ${S.sr}\n`;
  t+=`<b>tries</b> ${st.tries}   <b>phase</b> ${st.phase}`;
  d.innerHTML=t;
}

// ---------- bar ----------
function setParam(k,v){const u=new URL(location);if(v===null)u.searchParams.delete(k);else u.searchParams.set(k,v);history.replaceState(null,'',u);}
function syncBar(){
  const sel=$('#b-step'); if(!sel.options.length){sel.innerHTML=`<option value="-1">intro</option>`+STEPS.map((s,i)=>`<option value="${i}">${i+1} · ${s.phase} · ${s.title}</option>`).join('')+`<option value="${STEPS.length}">Lesson end</option>`;}
  sel.value=String(idx); $('#b-spec').setAttribute('aria-pressed',showSpec); $('#b-motion').setAttribute('aria-pressed',reduced);
}
$('#b-step').onchange=e=>go(+e.target.value);
$('#b-prev').onclick=()=>go(idx-1); $('#b-next').onclick=()=>go(idx+1);
$('#b-spec').onclick=()=>{showSpec=!showSpec;setParam('spec',showSpec?'1':null);syncBar();renderSpec();};
$('#b-motion').onclick=()=>{reduced=!reduced;setParam('motion',reduced?'reduced':null);render();};
$('#b-reset').onclick=()=>{fresh();render();};
$('#b-about').onclick=()=>go(-1);
function say(t){const l=$('#live');l.textContent='';setTimeout(()=>l.textContent=t,30);}
fresh(); render();
</script>
