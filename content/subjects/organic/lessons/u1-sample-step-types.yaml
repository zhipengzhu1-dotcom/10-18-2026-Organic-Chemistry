# Sample Lesson for the Numeric input and Rank / order Step types (#63). Not
# from a Lesson spec; it exists so the smoke tests can drive both Step types.
# Remove it from the course manifest once real Lessons use them.
id: u1-sample-step-types
slug: sample-numbers-and-order
title: "Sample: Numbers and Order"
goal: Answer with a number in a fixed unit, and put carbon–carbon bonds in order of length.
keyIdea: More electron pairs shared between two carbons pull them closer, so C≡C is shorter than C=C, which is shorter than C–C.
steps:
  - id: s01
    phase: hook
    type: multiple-choice
    prediction: true
    prompt: Carbon can join carbon with one, two or three shared pairs. Which bond do you think is the shortest?
    options:
      - { id: a, text: "C–C (one pair)" }
      - { id: b, text: "C=C (two pairs)" }
      - { id: c, text: "C≡C (three pairs)" }
    answer: [c]
    reveal: C≡C. Each extra shared pair pulls the two carbons closer together.

  - id: s02
    phase: build
    type: explain
    text: "Typical lengths: C–C about 1.54 Å, C=C about 1.34 Å, C≡C about 1.20 Å. More shared pairs, shorter bond."

  - id: s03
    phase: build
    type: rank
    prompt: Put the bonds in order, **shortest first**.
    items:
      - { id: double, text: "C=C" }
      - { id: single, text: "C–C" }
      - { id: triple, text: "C≡C" }
    answer: [triple, double, single]
    correct: Three shared pairs hold the carbons closest; one pair holds them farthest apart.
    hints:
      - match: [single, double, triple]
        text: That is longest first. Flip it so the shortest bond is at the top.
      - text: Count the shared pairs. The more pairs, the shorter the bond.
    reveal: "C≡C (1.20 Å), then C=C (1.34 Å), then C–C (1.54 Å)."

  - id: s04
    phase: build
    type: explain
    text: In methane, CH₄, the four bonds spread as far apart as they can in 3D. That shape is a **tetrahedron**.

  - id: s05
    phase: build
    type: numeric
    prompt: What is the H–C–H angle in methane?
    unitSymbol: "°"
    answer: 109.5
    tolerance: 0.5
    correct: The tetrahedral angle, 109.5°, puts the four bonds as far apart as 3D allows.
    hints:
      - match: 90
        text: 90° is a flat square drawn on paper. In 3D the bonds can spread farther.
      - match: 120
        text: 120° is three bonds in a flat triangle. Methane has four bonds in 3D.
      - text: Picture four bonds pointing to the corners of a tetrahedron. The angle is a little more than 109°.
    reveal: "109.5°: the tetrahedral angle."

  - id: s06
    phase: build
    type: explain
    text: Each bond is a **pair** of shared electrons. A double bond shares two pairs.

  - id: s07
    phase: build
    type: numeric
    prompt: How many electrons are shared in a C=C double bond?
    unitSymbol: electrons
    answer: 4
    tolerance: 0
    correct: Two shared pairs make four electrons.
    hints:
      - match: 2
        text: Two is the number of bonds. Each bond is a pair of electrons.
      - text: Count the pairs in a double bond, then two electrons per pair.
    reveal: "4: a double bond is two shared pairs."

  - id: s08
    phase: check
    problem: u1-sample-p3

  - id: s09
    phase: check
    problem: u1-sample-p4

  - id: s10
    phase: wrap
    type: explain
    text: Each bond is a shared pair. More pairs between two carbons pull them closer, so C≡C is the shortest and C–C the longest.
