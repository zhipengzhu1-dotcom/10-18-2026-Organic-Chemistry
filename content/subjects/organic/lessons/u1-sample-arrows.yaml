# Sample Lesson for Draw arrows (#72). Not a real Lesson: it proves the path
# from structure files to the live push UI and backs the browser test. Its
# Draw-arrows Steps copy Lesson 6 s04, s06, s08 and Lesson 8 s11; its Check
# Problems are Lesson 6's ozone and the open acetylacetonate Practice Problem.
# Remove it (and its structures and Problems) with the other samples in #88,
# once Lessons 6–8 (#84–#86) land.
id: u1-sample-arrows
slug: sample-push-the-electrons
title: "Sample: Push the Electrons"
goal: Push lone pairs and π bonds with curved arrows to turn one drawing into another.
keyIdea: Curved arrows move lone pairs and π bonds from source to sink; atoms and σ bonds never move.
signature: s04
steps:
  - id: s01
    phase: hook
    type: multiple-choice
    prediction: true
    prompt: A curved arrow in a mechanism shows something moving. What?
    options:
      - { id: a, text: "An atom" }
      - { id: b, text: "A pair of electrons" }
      - { id: c, text: "A whole bond, atoms and all" }
    answer: [b]
    reveal: A pair of electrons. The tail sits on the pair that moves; the head points where it lands.

  - id: s02
    phase: build
    type: explain
    text: "Sources: a **lone pair** or a **π bond**. Sinks: an electronegative atom, an atom with room for more electrons, or a positive atom."

  - id: s03
    phase: build
    type: tap-to-identify
    prompt: Nitromethane. This one is tap-only. Tap every place electrons could flow **from**, then press Check.
    structure: nitromethane
    tappable: { atoms: all, bonds: all }
    tapOnly:
      idle: Just tap, no pushing on this Step.
      drag: "No pushing yet: this Step only asks where electrons could come from. Tap each lone pair or bond you think is a source."
    answer: [a3, a4, b2]
    correct: Lone pairs on both oxygens and the N=O π bond. Every other bond here is σ.
    hints:
      - includes: [a2]
        text: N⁺ here has four bonds and no lone pair, so it has nothing to give.
      - includes: [b1, b3, b4, b5, b6]
        text: That's a σ bond. Only lone pairs and π bonds move; σ bonds stay put.
      - text: Sources are lone pairs and π bonds. Find every one.
    reveal: The lone pairs on both oxygens and the N=O π bond.

  - id: s04
    phase: build
    type: draw-arrows
    prompt: Push the electrons to turn formaldehyde into its other contributor.
    start: formaldehyde
    results: [formaldehyde-polar]
    answer:
      - { from: b1, to: a2 }
    correct: "The π pair is now a lone pair on O: O⁻ and C⁺. Same atoms, same σ bonds. Only the π electrons moved."
    hints:
      - from: [b1]
        to: [a1]
        text: Electrons flow to the sink. Oxygen is more electronegative, so it pulls the pair.
      - from: [a2]
        to: [a1]
        text: That pushes more electrons onto carbon, which already has a full octet. Move a pair away from carbon instead.
      - from: [b2, b3]
        text: σ bonds never move in resonance.
      - text: Which atom is the sink? Move the pair that sits between C and O toward it.
    reveal: The C=O π pair moves onto oxygen. Result H₂C⁺–O⁻.
    # Sample only: shows that a Step's own Scene plays in place on success.
    scene: sample-twist

  - id: s05
    phase: build
    type: explain
    text: "Three moves: **lone pair → bond**, **bond → atom**, **bond → next bond**. If one push gives an atom too many electrons, a second push has to take some away."

  - id: s06
    phase: build
    type: draw-arrows
    prompt: Acetate. Push electrons to move the negative charge to the other oxygen.
    start: acetate
    results: [acetate-swapped]
    answer:
      - { from: a4, to: b3 }
      - { from: b2, to: a3 }
    inBetween:
      over: "{atom} has {electrons} e⁻: something has to leave. In resonance both arrows happen at once, so this halfway drawing isn't a real structure."
      short: "{atom} has only {electrons} e⁻. This halfway drawing isn't real either. Fill the gap."
    correct: The charge moved from one O to the other, and nothing else changed. Two drawings, one ion.
    hints:
      - from: [b2]
        to: [a2]
        text: Oxygen is the electronegative sink. Pull the π pair toward O, not C.
      - from: [a3]
        to: [a2]
        text: Start from the oxygen that carries the negative charge. It has the extra pair.
      - from: [sigma]
        text: σ bonds stay put.
      - text: One pair comes in from O⁻ and one pair leaves toward the other O.
    reveal: A lone pair on O⁻ comes into the C–O bond; the C=O π pair leaves onto the other O.

  - id: s07
    phase: build
    type: draw-arrows
    prompt: "The allyl cation. Slide the π bond toward the positive carbon."
    start: allyl-cation
    results: [allyl-cation-swapped]
    answer:
      - { from: b1, to: b2 }
    correct: The double bond slid one position and the + charge jumped to the other end.
    hints:
      - from: [b1]
        to: [a1, a2]
        text: That parks the pair on one carbon and leaves two C⁺. The empty spot is on C3, so slide the bond toward it.
      - from: [b2]
        text: That's σ. Only the π bond moves.
      - text: C3⁺ is the sink. Which π pair is next to it?
    reveal: The C1=C2 π pair slides into the C2–C3 bond. Now C2=C3 is double and C1 is positive.

  - id: s08
    phase: build
    type: draw-arrows
    prompt: "Push the electrons from NH₃'s lone pair into BF₃'s empty orbital on boron."
    start: ammonia-bf3
    results: [ammonia-bf3-adduct]
    answer:
      - { from: a1, to: a2 }
    correct: "A new N–B bond: N now shares a pair it used to own (N⁺), and B gains a share (B⁻)."
    hints:
      - from: [a3, a4, a5]
        to: [a2]
        text: F's pairs are held tightly. The highest filled orbital here is N's lone pair.
      - from: [b1, b2, b3]
        text: That moves electrons away from boron, the atom that's short. Electrons flow into boron's empty orbital.
      - from: [b4, b5, b6]
        text: σ bonds sit low. NH₃'s best pair to give is its lone pair.
      - text: Tail on the lone pair. Head on boron, the atom with room.
    reveal: N's lone pair becomes a bond to B. Result H₃N⁺–B⁻F₃.

  - id: s09
    phase: check
    problem: u1-sample-arrows-p1

  - id: s10
    phase: check
    problem: u1-sample-arrows-p2

  - id: s11
    phase: wrap
    type: explain
    text: "**Electrons move. Atoms don't.** Arrows go from a source (lone pair, π bond) to a sink."
