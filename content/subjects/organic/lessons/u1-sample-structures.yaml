# Sample Lesson for structure drawing, structure cards and Tap-to-identify
# (#62). Not from a Lesson spec; it proves the path from structure file to
# Step player and backs the browser test. Glycine (s05) follows Lesson 1's
# s08 and nitromethane (s07) Lesson 6's s03. Remove it from the course
# manifest once the real Unit 1 Lessons land.
id: u1-sample-structures
slug: sample-charges-you-can-tap
title: "Sample: Charges You Can Tap"
goal: Spot the atoms that carry a formal charge, and the places electrons can flow from.
keyIdea: An atom off its usual bonding pattern carries a formal charge; lone pairs and π bonds are where electrons flow from.
steps:
  - id: s01
    phase: hook
    type: multiple-choice
    prediction: true
    prompt: Glycine, an amino acid in your body, has no overall charge. Does that mean none of its atoms carries a charge?
    options:
      - { id: a, text: "Yes: no overall charge means no charged atoms" }
      - { id: b, text: "No: it can carry charges that cancel" }
      - { id: c, text: "Can't tell from the formula" }
    answer: [b]
    reveal: No. In water, glycine carries a + on its nitrogen and a − on one oxygen, and the two cancel.

  - id: s02
    phase: build
    type: explain
    text: "**Formal charge** = valence electrons − lone-pair electrons − bonds. Carbon is neutral with 4 bonds; with 3 bonds it is + (no lone pair) or − (one lone pair)."

  - id: s03
    phase: build
    type: multiple-choice
    prompt: Pick **every** structure that carries a formal charge.
    options:
      - { id: a, structure: methyl-cation, text: "CH₃⁺: carbon with three bonds to H, no lone pair, charge +1." }
      - { id: b, structure: methyl-anion, text: "CH₃⁻: carbon with three bonds to H and one lone pair, charge −1." }
      - { id: c, structure: methane, text: "CH₄: carbon with four bonds to H." }
    answer: [a, b]
    correct: "CH₃⁺ (4 − 0 − 3 = +1) and CH₃⁻ (4 − 2 − 3 = −1). Methane's carbon is 4 − 0 − 4 = 0."
    hints:
      - includes: [c]
        text: "Methane's carbon has 4 bonds and no lone pair: 4 − 0 − 4 = 0."
      - misses: [a, b]
        text: Both three-bond carbons are charged. Check whether each has a lone pair.
      - text: Work out the carbon's formal charge on every card.
    reveal: "CH₃⁺ and CH₃⁻ carry charges; methane is neutral."

  - id: s04
    phase: build
    type: explain
    text: A nitrogen with **4 bonds** is +1. An oxygen with **1 bond** and 3 lone pairs is −1.

  - id: s05
    phase: build
    type: tap-to-identify
    prompt: Here is glycine as it is in your body. The charges have been hidden. Tap **every** atom that carries a formal charge, then press Check.
    structure: glycine-zwitterion
    hide: [charges]
    tappable: { atoms: all }
    answer: [a1, a5]
    correct: "N has 4 bonds (+1); the single-bonded O has 1 bond and 3 lone pairs (−1). The whole molecule is neutral, yet it carries two charges."
    hints:
      - includes: [a4]
        text: "That oxygen has 2 bonds (one double) and 2 lone pairs: 6 − 4 − 2 = 0. Its usual pattern."
      - includes: [a2, a3]
        text: "That carbon has 4 bonds and no lone pairs: 4 − 0 − 4 = 0."
      - includes: [a6, a7, a8, a9, a10]
        text: "Each H has its 1 bond: 1 − 0 − 1 = 0."
      - match: [a1]
        text: One more. Find the oxygen with only one bond.
      - match: [a5]
        text: One more. Count the nitrogen's bonds.
      - text: "Look for an atom off its usual pattern: an N with 4 bonds, an O with 1."
    reveal: "N: 5 − 0 − 4 = +1, and the single-bonded O: 6 − 6 − 1 = −1."

  - id: s06
    phase: build
    type: explain
    text: Electrons flow **from** a lone pair or a π bond (the second line of a double bond). σ bonds stay put.

  - id: s07
    phase: build
    type: tap-to-identify
    prompt: Nitromethane. Tap every place electrons could flow **from**, then press Check.
    structure: nitromethane
    tappable: { atoms: all, bonds: all }
    tapOnly:
      idle: Just tap, no pushing on this Step.
      drag: "No pushing yet: this Step only asks where electrons could come from. Tap each lone pair or bond you think is a source."
    answer: [a3, a4, b2]
    correct: Lone pairs on both oxygens and the N=O π bond. Every other bond here is σ.
    hints:
      - includes: [a2]
        text: N⁺ here has four bonds and no lone pair, so it has nothing to give.
      - includes: [b1, b3, b4, b5, b6]
        text: That's a σ bond. Only lone pairs and π bonds move; σ bonds stay put.
      - includes: [a1, a5, a6, a7]
        text: Look for lone pairs or π bonds. This carbon and its H's have neither.
      - misses: [b2]
        text: A double bond is one σ plus one π, and the π pair is free to move.
      - misses: [a3, a4]
        text: Both oxygens carry lone pairs. Check the other one.
      - text: Sources are lone pairs and π bonds. Find every one.
    reveal: The lone pairs on both oxygens and the N=O π bond.

  - id: s08
    phase: check
    problem: u1-sample-p3

  - id: s09
    phase: check
    problem: u1-sample-p4

  - id: s10
    phase: wrap
    type: explain
    text: You tapped charges that were hidden and found where electrons can flow from. Count bonds and lone pairs, and the drawing tells you both.
