id: u1-l05
slug: functional-groups
title: Functional Groups
goal: Find and name the core functional groups inside a real molecule by looking past its C–H skeleton and reading each heteroatom or π bond together with its neighbours.
keyIdea: A functional group is a small cluster of heteroatoms or π bonds that behaves the same in any molecule. Find them by skipping the C–H skeleton, and name each one by what its heteroatom or C=O touches.
act: Reading Molecules
signature: s13
steps:
  - id: s01
    phase: hook
    type: multiple-choice
    prediction: true
    prompt: Vinegar tastes sour because acetic acid can give away H⁺ from its –COOH end. Amoxicillin, an antibiotic, is far bigger. Can it do the same trick?
    figure:
      - { structure: fg-acetic-acid, hide: [lone-pairs], text: "Acetic acid: CH₃ joined to a carbon that is double-bonded to O and single-bonded to OH." }
      - { structure: fg-amoxicillin, hide: [lone-pairs], text: "Amoxicillin: a benzene ring with OH, a chain with NH₂ and a C=O–NH, a four-membered ring fused to a five-membered ring containing S, and a C(=O)OH at the bottom right." }
    options:
      - { id: a, text: "No: a bigger molecule behaves differently all over" }
      - { id: b, text: "Yes: it carries the same –COOH piece" }
      - { id: c, text: "Can't tell without testing it in a lab" }
    answer: [b]
    reveal: "**Yes.** The same –COOH sits on both, and it gives away H⁺ in both. A piece like this, which acts the same whatever it's bolted to, is a **functional group**. Spot the groups and you can read a molecule you've never seen."
    revealScene: { id: group-spotlight, state: { view: acid-pair } }
    sourceNote: "The idea that a group behaves the same in any molecule follows MIT OCW 5.12, Lecture 1 p. 15, Berkowski, Spring 2005, CC BY-NC-SA 4.0. Structures: PubChem CIDs 176 and 33613."

  - id: s02
    phase: build
    type: explain
    text: |-
      Most of an organic molecule is **skeleton**: carbons joined to carbons and hydrogens. C–C and C–H bonds are barely polar and all σ, so the skeleton is quiet. (A molecule that is all skeleton is an **alkane**.)\
      The action is where the skeleton is broken by a **π bond** or a **heteroatom**, any atom that isn't C or H. Those spots are the **functional groups**.\
      Four need no O or N:\
      **alkene** C=C · **alkyne** C≡C · **arene** a six-ring of alternating double bonds · **alkyl halide** C–F, C–Cl, C–Br or C–I (on an arene ring it's an aryl halide).
    scene: { id: group-cards, state: { family: hydrocarbon } }
    sourceNote: "Groups from the MIT OCW 5.12 *Functional Groups* sheet and Lecture 1 p. 15, Berkowski, Spring 2005, CC BY-NC-SA 4.0."

  - id: s03
    phase: build
    type: multiple-choice
    prompt: Which molecule has **no** functional group?
    options:
      - { id: a, structure: fg-hexane, hide: [lone-pairs], text: "Hexane: a zigzag chain of six carbons." }
      - { id: b, structure: fg-cyclohexene, hide: [lone-pairs], text: "Cyclohexene: a ring of six carbons with one double bond." }
      - { id: c, structure: fg-benzene, hide: [lone-pairs], text: "Benzene: a ring of six carbons with alternating double bonds." }
      - { id: d, structure: fg-chloroethane, hide: [lone-pairs], text: "Chloroethane: two carbons, the second bonded to Cl." }
    answer: [a]
    correct: "Hexane is all skeleton: only C–C and C–H σ bonds. Every other card has a π bond or a heteroatom."
    hints:
      - match: [c]
        text: "Benzene is only C and H, but count its double bonds. That ring of π bonds is a group: the arene."
      - match: [b]
        text: Look for a double line. One C=C is enough to make an alkene.
      - match: [d]
        text: Cl isn't C or H. A carbon bonded to a halogen is an alkyl halide.
      - text: Find the molecule with no π bond and no atom besides C and H.
    reveal: "Hexane: skeleton only. The others: cyclohexene, alkene; benzene, arene; chloroethane, alkyl halide."
    sourceNote: "Structures: PubChem CIDs 8058, 8079, 241, 6337."

  - id: s04
    phase: build
    type: explain
    text: |-
      O and N on single bonds make the next family. Name each one by **what the heteroatom touches**:\
      **alcohol** C–OH on a skeleton carbon · **phenol** OH on an arene ring (it behaves differently enough to get its own name)\
      **ether** C–O–C, no H on the O · **sulfide** C–S–C, ether's sulfur twin\
      **amine** C–N, with N carrying H's or more carbons (NH₂, NH or N)
    scene: { id: group-cards, state: { family: single-bond } }
    sourceNote: "Groups from the MIT OCW 5.12 *Functional Groups* sheet and Lecture 1 p. 15, CC BY-NC-SA 4.0."

  - id: s05
    phase: build
    type: multiple-choice
    prompt: Pick **every** alcohol.
    options:
      - { id: a, structure: fg-ethanol, hide: [lone-pairs], text: "Ethanol: two carbons, the second carrying OH." }
      - { id: b, structure: fg-phenol, hide: [lone-pairs], text: "Phenol: a benzene ring carrying OH." }
      - { id: c, structure: fg-cyclohexanol, hide: [lone-pairs], text: "Cyclohexanol: a ring of six carbons with single bonds only, one carrying OH." }
      - { id: d, structure: fg-diethyl-ether, hide: [lone-pairs], text: "Diethyl ether: an O between two two-carbon chains." }
      - { id: e, structure: fg-methylamine, hide: [lone-pairs], text: "Methylamine, drawn CH₃–NH₂." }
    answer: [a, c]
    correct: "Both put OH on a skeleton carbon. A ring doesn't matter, as long as it isn't an arene."
    hints:
      - includes: [b]
        text: That OH sits on an arene ring carbon. That makes it a phenol, the alcohol's twin with its own name.
      - includes: [d]
        text: This O has a carbon on both sides and no H. That's an ether.
      - includes: [e]
        text: "Look at the letter: N, not O. That's an amine."
      - match: [a]
        text: There's another. An OH on a ring carbon still counts, if the ring has no alternating double bonds.
      - match: [c]
        text: There's another, the smallest one here.
      - text: An alcohol is O–H on a carbon that is plain skeleton, not part of an arene.
    reveal: "Ethanol and cyclohexanol are the alcohols. Phenol is a phenol, diethyl ether an ether, methylamine an amine."
    sourceNote: "Structures: PubChem CIDs 702, 996, 7966, 3283, 6329."

  - id: s06
    phase: build
    type: tap-to-identify
    prompt: Ethinylestradiol, the estrogen in many birth-control pills, is Lesson 0's estradiol with one piece added. Tap its **three** functional groups, then press Check.
    structure: fg-ethinylestradiol
    hide: [lone-pairs]
    tappable:
      regions:
        - { id: phenol, atoms: [a16, a17, a18, a19, a20, a21, a22], label: "The left ring, with HO at its lower left." }
        - { id: ring-b, atoms: [a5, a6, a14, a15], label: "The second ring from the left." }
        - { id: ring-c, atoms: [a2, a3, a4], label: "The third ring from the left, upper middle." }
        - { id: ring-d, atoms: [a7, a8, a9, a10], label: "The five-membered ring at the right." }
        - { id: methyl, atoms: [a1], label: "The methyl at the junction of the third and fifth rings." }
        - { id: alkyne, atoms: [a11, a12], label: "The carbon–carbon triple bond at the top right." }
        - { id: alcohol, atoms: [a13], label: "The OH at the top right." }
    answer: [phenol, alkyne, alcohol]
    correct: "Two OH's, two different groups: the one on the arene is a phenol, the one on a skeleton carbon is an alcohol. The C≡C is the piece added to estradiol."
    hints:
      - includes: [ring-b, ring-c, ring-d, methyl]
        text: "That part is skeleton: only C–C and C–H σ bonds. Groups have a π bond or a heteroatom."
      - misses: [alkyne]
        text: One group has no heteroatom at all. Look for a triple line.
      - misses: [alcohol]
        text: There's a second OH, top right. Its carbon isn't in an arene.
      - misses: [phenol]
        text: The left ring has alternating double bonds and an OH. Together they're one group.
      - text: Skip the C–H skeleton. Tap every π bond and every heteroatom.
    reveal: The phenol (left ring with its OH), the alkyne (C≡C) and the alcohol (the OH at the top right).
    revealScene: { id: group-spotlight, state: { view: ethinylestradiol } }
    sourceNote: "Structure: PubChem CID 5991. Estradiol from Lesson 0 (MIT OCW 5.12, Lecture 1 p. 5, CC BY-NC-SA 4.0)."

  - id: s07
    phase: build
    type: explain
    text: |-
      The biggest family is built on **C=O**, the carbonyl. Read the C=O **together with what's on the other side of its carbon**:\
      H → **aldehyde** · C → **ketone** · OH → **carboxylic acid** · O–C → **ester** · N → **amide**\
      One C=O plus its neighbour is **one** group. A C=O next to OH is a carboxylic acid, not a ketone plus an alcohol.
    scene: carbonyl-neighbours
    sourceNote: "Groups from the MIT OCW 5.12 *Functional Groups* sheet, CC BY-NC-SA 4.0."

  - id: s08
    phase: build
    type: multiple-choice
    prompt: Ethyl acetate is the sweet smell of some nail-polish removers. Which group is it?
    figure:
      - { structure: fg-ethyl-acetate, hide: [lone-pairs], text: "Ethyl acetate: CH₃ joined to a C=O carbon, whose other side is an O, then a two-carbon chain." }
    options:
      - { id: a, text: a ketone and an ether }
      - { id: b, text: an ester }
      - { id: c, text: a carboxylic acid }
      - { id: d, text: an aldehyde and an ether }
    answer: [b]
    correct: "The O right next to the C=O carbon belongs to the group: C=O with O–C beside it is an ester."
    hints:
      - match: [a]
        text: "Don't split it. The O touches the C=O carbon, so C=O and O–C read together as one group."
      - match: [c]
        text: A carboxylic acid ends in O–H. Here that O carries a carbon instead.
      - match: [d]
        text: An aldehyde has H on the C=O carbon. This one has a carbon on one side and an O on the other.
      - text: Read the C=O with what sits on the other side of its carbon.
    reveal: "An ester: the C(=O)O reads as one piece. C=O + O–C = ester."
    sourceNote: "Structure: PubChem CID 8857."

  - id: s09
    phase: build
    type: tap-to-identify
    prompt: Aspartame, a sweetener. Tap every group that contains a **C=O**, then press Check.
    structure: fg-aspartame
    hide: [lone-pairs]
    tappable:
      regions:
        - { id: ester, atoms: [a1, a2, a3, a4], label: "At the top left, C=O with O–CH₃." }
        - { id: ch-left, atoms: [a5], label: "The CH below it, at the left." }
        - { id: ch2-left, atoms: [a6], label: "The CH₂ joining that CH to the ring." }
        - { id: arene, atoms: [a7, a8, a9, a10, a11, a12], label: "The benzene ring at the bottom left." }
        - { id: amide, atoms: [a13, a14, a15], label: "In the middle, C=O with NH." }
        - { id: ch-right, atoms: [a16], label: "The CH carrying NH₂, right of the middle." }
        - { id: amine, atoms: [a21], label: "The NH₂ below that CH." }
        - { id: ch2-right, atoms: [a17], label: "The CH₂ at the right." }
        - { id: acid, atoms: [a18, a19, a20], label: "At the right, C=O with OH." }
    answer: [ester, amide, acid]
    correct: "Three carbonyls, three different groups, told apart by the neighbour: O–C (ester), N (amide), OH (acid)."
    hints:
      - includes: [amine]
        text: "That NH₂ is on a carbon with no C=O, so it's an amine. For an amide the N has to sit right on the C=O carbon."
      - includes: [arene]
        text: The ring's double bonds are C=C, not C=O.
      - includes: [ch-left, ch2-left, ch-right, ch2-right]
        text: That's skeleton. Look for the letter O double-bonded to C.
      - misses: [ester, amide, acid]
        text: There are three C=O's. Check the far ends of the molecule.
      - text: Find each O drawn with a double line to carbon. Tap the C=O with its neighbour.
    reveal: "The ester (C=O with O–CH₃), the amide (C=O with NH) and the carboxylic acid (C=O with OH). The NH₂ (amine) and the ring (arene) have no C=O."
    revealScene: { id: group-spotlight, state: { view: aspartame } }
    sourceNote: "Structure: PubChem CID 134601."

  - id: s10
    phase: build
    type: multiple-choice
    prompt: Every penicillin, amoxicillin included, has this four-membered ring. What group is the C=O inside it?
    figure:
      - { structure: fg-azetidinone, hide: [lone-pairs], text: "2-Azetidinone: a four-membered ring of three carbons and an NH, with a C=O on the carbon next to the N." }
    options:
      - { id: a, text: a ketone and an amine }
      - { id: b, text: an amide }
      - { id: c, text: "none: groups in rings don't count" }
      - { id: d, text: an ester }
    answer: [b]
    correct: "N sits right on the C=O carbon, so it's an amide. A ring changes nothing: a group in a ring is still that group."
    hints:
      - match: [a]
        text: The N touches the C=O carbon directly. Read them as one group.
      - match: [c]
        text: Cyclohexanol was still an alcohol. A ring doesn't hide a group.
      - match: [d]
        text: The ring atom beside the C=O is N, not O.
      - text: What is the neighbour on the other side of the C=O carbon?
    reveal: "An amide: the C=O and the N read together. C=O + N = amide, here in a ring."
    sourceNote: "Structure: PubChem CID 136721."

  - id: s11
    phase: check
    problem: u1-fg-ketone

  - id: s12
    phase: check
    problem: u1-fg-capsaicin

  - id: s13
    phase: check
    problem: u1-fg-amoxicillin

  - id: s14
    phase: wrap
    type: explain
    text: |-
      **Skip the skeleton. Read the neighbours.**\
      Groups live where there's a π bond or a heteroatom.\
      Name an O, N or S by what it touches; read a C=O with the atom beside its carbon.\
      A group behaves the same in any molecule, so a few groups let you read thousands of molecules.
    scene: { id: group-cards, state: { family: all, start: dealt } }
