  - id: s03
    phase: build
    type: explain
    text: |-
      Acetamide is a blend of both drawings, but **not 50:50**. The hybrid is a **weighted** blend: the more stable drawing counts more. It's the **major contributor**; the others are **minor contributors**.

      Minor still matters. Acetamide's charged drawing is minor, yet it's why the C–N bond is shorter than a single bond.
    scene: amide-hybrid
    source: "Weighting idea from MIT OCW 5.12, Lecture 2 p. 2, 'Rules for Resonance Structures', Berkowski, Spring 2005, CC BY-NC-SA 4.0. Bond lengths computed with PySCF, B3LYP/cc-pVTZ, gas phase. All three molecules use the same method so they can be compared fairly. Structures: PubChem CIDs 6329, 178 and 123139."

  - id: s04
    phase: build
    type: multiple-choice
    prompt: "Gut check before the rules: which acetamide drawing is the major contributor?"
    options:
      - { id: a, structure: acetamide, text: "CH₃–C(=O)–NH₂, no charges: C=O double bond, C–N single bond." }
      - { id: b, structure: acetamide-polar, text: "CH₃–C(–O⁻)=N⁺H₂: C–O single bond with O⁻, C=N double bond with N⁺." }
      - { id: c, text: "They count equally" }
    answer: [a]
    correct: "No charges beats two. Pulling + and − apart costs energy, so the neutral drawing is major."
    hints:
      - { match: [b], text: "Count the formal charges in each. Separating + from − costs energy." }
      - { match: [c], text: "Equal weight needs the two drawings to be equally good. One carries two charges, the other none." }
      - text: "Which drawing has fewer formal charges?"
    reveal: "Both have full octets; the neutral one has no charges, so it wins."

  - id: s05
    phase: build
    type: explain
    text: |-
      To rank contributors, test them against **four rules, in order**. The first rule that tells two drawings apart decides.

      1. **Full octets.** C, N, O and F each have 8 electrons. Only carbon is ever drawn with 6, and that costs a lot.
      2. **Fewest charges.** Fewer formal charges (so more bonds) is better.
      3. **− on the more electronegative atom.** C < N < O < F, as in Lesson 1.
      4. **Charges close together.** If two drawings tie on 1–3, the one with + and − nearer each other wins.
    scene: { id: rule-ladder, state: { rung: all } }
    source: "The four guidelines and their order adapted from MIT OCW 5.12, Lecture 2 p. 4, 'Predicting Energies of Resonance Structures', Berkowski, Spring 2005, CC BY-NC-SA 4.0."

  - id: s06
    phase: build
    type: multiple-choice
    prompt: The methoxymethyl cation. Which contributor is major?
    options:
      - { id: a, structure: methoxymethyl-cation-c, text: "CH₃–O–CH₂⁺: + on carbon; the CH₂ carbon has three bonds and no lone pair." }
      - { id: b, structure: methoxymethyl-cation-o, text: "CH₃–O⁺=CH₂: + on oxygen; O⁺ double-bonded to CH₂, one lone pair on O." }
      - { id: c, text: "They count equally" }
    answer: [b]
    correct: "Rule 1 first. In CH₃–O⁺=CH₂ every atom has an octet, and that outranks where the + sits, even on an electronegative O."
    hints:
      - { match: [a], text: "Count the electrons around the CH₂ carbon in each drawing. Rule 1, full octets, comes before anything about electronegativity." }
      - { match: [c], text: "They differ on rule 1. Count the electrons on the CH₂ carbon in each." }
      - text: "Go rule by rule: which drawing gives every atom 8 electrons?"
    reveal: "CH₂⁺ has only 6 e⁻ (rule 1 fails); O⁺=CH₂ gives every atom 8."

