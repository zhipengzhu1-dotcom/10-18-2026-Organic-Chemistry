      - { id: c, text: "As short as methanimine's C=N" }
    answer: [b]
    reveal: "Acetamide's C–N is **{{acetamide/r.CN}}** (computed): shorter than methylamine's single bond ({{methylamine/r.CN}}), longer than methanimine's double bond ({{methanimine/r.CN}}). So a drawing with C=N must count, but only partly. Which drawings count, and how much? That's this Lesson."
    # The three molecules show first with their C–N bonds highlighted; the lengths appear on reveal.
