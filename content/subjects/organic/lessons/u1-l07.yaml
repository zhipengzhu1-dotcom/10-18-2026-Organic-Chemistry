  - id: s08
    phase: build
    type: multiple-choice
    prompt: Which enolate drawing is the major contributor?
    options:
      - { id: a, structure: acetone-enolate, text: "CH₂=C(CH₃)–O⁻: − on oxygen, C=C double bond." }
