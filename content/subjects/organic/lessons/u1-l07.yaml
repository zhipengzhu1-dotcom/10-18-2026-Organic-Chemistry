      short: "{atom} has only {electrons} e⁻. This halfway drawing isn't real either. Fill the gap."
    correct: "Now the − sits on the CH₂ carbon and the double bond is C=O. Two drawings of one anion: which counts more?"
    hints:
      - { from: [b1], to: [a2], text: "C2 is about to receive O's pair. Send the C=C pair the other way, onto the CH₂ end." }
      - { from: [sigma], text: "σ bonds stay put." }
      - text: "One pair in from O⁻ to make C=O; one pair out of C=C onto the CH₂ carbon."
