# Carbon's share by mass of Earth's crust and of the human body (Lesson 0 s01, #78).
# Crust: CRC Handbook, "Abundance of Elements in the Earth's Crust and in the Sea":
# C 2.00×10² mg/kg = 0.02% by mass (checked 2026-10-19 against the CRC column of
# Wikipedia's "Abundances of the elements (data page)").
# Body: ICRP Publication 23, Reference Man (1975), Table 110 "Total body content for
# some elements", pp. 327-328: carbon 16,000 g, 23 percent of total body weight
# (70 kg Reference Man; checked 2026-10-19 against the table scan BioNumbers links,
# BNID 110328). Values are facts from the literature, cited.
id: carbon-abundance
kind: table
title: Carbon in Earth's crust and in the human body
