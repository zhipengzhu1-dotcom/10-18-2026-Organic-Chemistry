    licence: Published values, cited (facts from the literature)
  icrp23:
    kind: reference
    citation: ICRP Publication 23, Report of the Task Group on Reference Man (Pergamon, 1975), Table 110, pp. 327-328 (C 16,000 g of a 70 kg body)
