  F.colour: { label: F colour, quantity: colour, value: "#90E050", source: jmol }
  P.colour: { label: P colour, quantity: colour, value: "#FF8000", source: jmol }
  S.colour: { label: S colour, quantity: colour, value: "#FFFF30", source: jmol }
  Cl.colour: { label: Cl colour, quantity: colour, value: "#1FF01F", source: jmol }
  Br.colour: { label: Br colour, quantity: colour, value: "#A62929", source: jmol }
  I.colour: { label: I colour, quantity: colour, value: "#940094", source: jmol }

