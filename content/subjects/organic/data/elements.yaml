# Per-element display data (ADR 0002). Viewers and Scenes read colours and
# radii from here through the lookup (elementStyle / cite), never from a
# library's built-in defaults. Each column has one cited table.
#
# Checked 2026-10-19:
#   colours  argbsCpk in Jmol's src/org/jmol/c/PAL.java (Jmol-SwingJS commit aa52adb)
#   vdw      Bondi 1964, Table I (cross-checked against Wikipedia "Van der Waals radius"); B from
#            Mantina et al. 2009 (as Wikipedia's table cites it), checked 2026-10-19 for Lesson 3's BF₃
#   covalent Cordero et al. 2008, Table 2 (cross-checked against Wikipedia "Covalent radius")
id: elements
kind: table
title: Elements
sources:
  jmol:
    kind: reference
    citation: the Jmol CPK colour table (Jmol, org/jmol/c/PAL.java), https://github.com/BobHanson/Jmol-SwingJS
    licence: Jmol is LGPL 2.1; colour values used as data
  bondi1964:
    kind: reference
    citation: Bondi, J. Phys. Chem. 68, 441 (1964), doi:10.1021/j100785a001
    licence: Published values, cited (facts from the literature)
  mantina2009:
    kind: reference
    citation: Mantina et al., J. Phys. Chem. A 113, 5806 (2009), doi:10.1021/jp8111556
    licence: Published values, cited (facts from the literature)
  cordero2008:
    kind: reference
    citation: Cordero et al., Dalton Trans. 2832 (2008), doi:10.1039/b801115j
    licence: Published values, cited (facts from the literature)
values:
  H.colour: { label: H colour, quantity: colour, value: "#FFFFFF", source: jmol }
  B.colour: { label: B colour, quantity: colour, value: "#FFB5B5", source: jmol }
  C.colour: { label: C colour, quantity: colour, value: "#909090", source: jmol }
  N.colour: { label: N colour, quantity: colour, value: "#3050F8", source: jmol }
