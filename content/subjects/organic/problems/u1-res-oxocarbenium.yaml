# Lesson 6 Check Problem (spec: docs/specs/unit-1/lesson-06-resonance.md).
id: u1-res-oxocarbenium
unit: u1
lesson: u1-l06
difficulty: 2
status: approved
source: Adapted from MIT OCW 5.12, Problem Set 1 Q6c, Berkowski, Spring 2005, CC BY-NC-SA 4.0.
type: draw-arrows
prompt: Push electrons to turn this cation into its oxocarbenium contributor (shown).
start: dihydropyranyl-cation
results: [dihydropyranyl-oxocarbenium]
answer:
  - { from: a6, to: a5 }
  - { from: b4, to: a3 }
inBetween:
  over: "{atom} would have {electrons} e⁻. Something has to leave."
  short: "{atom}⁺, next to O. That's a valid contributor too. Keep going to reach the target."
correct: "Oxygen's lone pair joined the π system: the + charge ends up on O, which still has a full octet."
hints:
  - from: [a6]
    to: [a1]
    text: C1 already has four bonds and is not in the π system. Push toward C5.
  - from: [b4]
    to: [a4, a5]
    text: That parks the pair as a lone pair and leaves two cations. Slide the bond toward C3⁺ instead.
  - from: [sigma]
    text: σ bonds stay put, ring bonds included.
  - text: "Two moves: the π bond slides toward C⁺, and O's lone pair fills the gap it leaves."
reveal: "Both arrows: O6's lone pair into the O6–C5 bond, and the C4=C5 π pair into the C3–C4 bond. The + charge ends on O."
