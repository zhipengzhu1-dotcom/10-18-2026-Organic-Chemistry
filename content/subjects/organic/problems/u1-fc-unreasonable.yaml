# Lesson 1 Check Problem (#79), from the merged Lesson 1 spec.
id: u1-fc-unreasonable
unit: u1
lesson: u1-l01
difficulty: 2
status: approved
source: Adapted from MIT OCW 5.12 Problem Set 1 Q1
credit: Kimberly Berkowski, MIT OCW 5.12, Spring 2005, CC BY-NC-SA 4.0
type: multiple-choice
prompt: Three of these atoms are in reasonable bonding patterns. Which one is **not**?
options:
  - { id: a, structure: frag-n-4, hide: [charges], text: "Nitrogen with four single bonds." }
  - { id: b, structure: frag-c-triple-lp1, hide: [charges], text: "Carbon with a triple bond and one lone pair." }
  - { id: c, structure: frag-n-three-single-one-double, hide: [charges], text: "Nitrogen with three single bonds and one double bond." }
  - { id: d, structure: frag-o-1-lp3, hide: [charges], text: "Oxygen with one single bond and three lone pairs." }
answer: [c]
correct: Five bonds put 10 electrons around nitrogen. Octet exceeded. The others are N⁺, C⁻ and O⁻, all real.
hints:
  - match: [a]
    text: "4 bonds, 8 electrons, formal charge 5 − 0 − 4 = +1. That's ammonium's nitrogen: real."
  - match: [b]
    text: "3 bonds + 1 lone pair = 8 electrons, charge 4 − 2 − 3 = −1. It's the carbon of cyanide: real."
  - match: [d]
    text: "1 bond + 3 lone pairs = 8 electrons, charge −1. That's hydroxide's oxygen: real."
  - text: Count electrons around each atom. Which one goes past 8?
reveal: "`c` 10 electrons: octet exceeded. The others: `a` +1, `b` −1, `d` −1."
sourceNote: "Adapted from MIT OCW 5.12, Problem Set 1 Q1, Berkowski, Spring 2005, CC BY-NC-SA 4.0."
