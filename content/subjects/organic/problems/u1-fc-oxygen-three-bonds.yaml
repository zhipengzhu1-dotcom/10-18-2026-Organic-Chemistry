  - match: -1
    text: Oxygen here has more bonds than usual, not fewer. Check the sign.
  - match: 2
    text: The double bond counts as 2 bonds, not as 2 bonds plus its electrons. 6 − 2 − 3.
  - text: Valence 6, minus lone-pair electrons, minus bonds (a double bond is 2).
