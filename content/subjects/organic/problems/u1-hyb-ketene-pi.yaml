# Lesson 4 Check Problem (#82), from the merged Lesson 4 spec (approved so the Check Step plays it).
# The spec's `ketene-pi` Scene is the 3D card with ketene's two computed π bond orbitals (#70),
# a Show toggle (both | C=C π | C=O π) and the H–C–H plane sheet.
id: u1-hyb-ketene-pi
unit: u1
lesson: u1-l04
difficulty: 3
status: approved
source: Adapted from MIT OCW 5.12 Problem Set 1 Q5b
credit: Kimberly Berkowski, MIT OCW 5.12, Spring 2005, CC BY-NC-SA 4.0
type: rotate-and-identify
prompt: Ketene, H₂C=C=O. Its middle carbon makes two π bonds, both shown here. Spin it. How do they sit?
molecule:
  id: ketene
  view: end-on
  label: Both
  orbitals: [ketene-orbitals/cc-pi, ketene-orbitals/co-pi]
  plane: { through: [3, 0, 4], label: H–C–H plane }
  describe: "Ketene: CH2, then C, then O, in a straight line from the middle carbon. The C=C π bond has lobes above and below the plane of the H–C–H group. The C=O π bond has its lobes in that plane, at right angles to the first. Labelled: computed."
  toggleLabel: Show
  toggle:
    - id: ketene
      view: end-on
      label: C=C π
      orbitals: [ketene-orbitals/cc-pi]
      plane: { through: [3, 0, 4], label: H–C–H plane }
    - id: ketene
      view: end-on
      label: C=O π
      orbitals: [ketene-orbitals/co-pi]
      plane: { through: [3, 0, 4], label: H–C–H plane }
options:
  - { id: a, text: both π bonds above and below the H–C–H plane }
  - { id: b, text: "the C=C π above and below the H–C–H plane; the C=O π lying in that plane" }
  - { id: c, text: "the C=C π lying in the H–C–H plane; the C=O π above and below it" }
  - { id: d, text: both π bonds lying in the H–C–H plane }
answer: [b]
correct: "The middle carbon is sp, with two p orbitals at right angles. One pairs with the CH₂ carbon's p, which stands at right angles to the H–C–H plane (C=C π). The other pairs with oxygen's p, in that plane (C=O π)."
hints:
  - includes: [a, d]
    text: "The middle carbon is sp: its two p orbitals are at right angles to each other, so its two π bonds can't lie the same way."
  - match: [c]
    text: "The CH₂ carbon is sp², and its leftover p stands at right angles to the H–C–H plane. That's the p in the C=C π."
  - text: Turn the plane toggle on, spin until the H–C–H plane is edge-on, then find each π bond's lobes.
reveal: "**b**. Seen side on with the plane on: the C=C π lobes sit above and below the H–C–H plane, and the C=O π lobes lie in it."
sourceNote: "Adapted from MIT OCW 5.12, Problem Set 1 Q5b, Berkowski, Spring 2005, CC BY-NC-SA 4.0."
