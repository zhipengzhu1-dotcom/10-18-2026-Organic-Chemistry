# Sample Draw-arrows Problem (#72): Lesson 6's u1-res-ozone. Remove with the samples in #88.
id: u1-sample-arrows-p1
unit: u1
lesson: u1-sample-arrows
difficulty: 1
status: approved
source: Adapted from MIT OCW 5.12, Problem Set 1 Q3c, Berkowski, Spring 2005, CC BY-NC-SA 4.0
type: draw-arrows
prompt: "Ozone, O₃. Push electrons to reach another resonance contributor. No atom may carry a charge beyond ±1."
start: ozone
results: [ozone-swapped]
answer:
  - { from: a3, to: b2 }
  - { from: b1, to: a1 }
inBetween:
  over: "Central O would have {electrons} e⁻. Something has to leave."
  short: "Central O now has only {electrons} e⁻. Not a real structure."
correct: The double bond and the − charge swapped ends. The central O stays +.
hints:
  - from: [b1]
    to: [a2]
    text: That leaves the end oxygen with only 6 electrons. Push the pair onto the end oxygen instead.
  - from: [a1]
    to: [a2]
    text: O1 has no extra pair to spare. Start from O⁻.
  - text: "Same pattern as acetate: one pair in from O⁻, one pair out to the far O."
reveal: "Both arrows: O3's lone pair into the O2–O3 bond, and the O1=O2 π pair onto O1. Result ⁻O–O⁺=O."
