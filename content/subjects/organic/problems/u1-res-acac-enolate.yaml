# Unit 1 Practice Problem (#87), from docs/specs/unit-1/practice-problems.md (approved). Open: either oxygen is a
# result, and no target is drawn. Reuses #72's acac-enolate structures (the sample u1-sample-arrows-p2 played this
# Problem until now; #88 removes the sample).
id: u1-res-acac-enolate
unit: u1
lesson: u1-l06
difficulty: 2
status: approved
source: Adapted from LibreTexts Wade 1-20(f) and its solution
credit: "LibreTexts, Map: Organic Chemistry (Wade), CC BY-NC-SA 4.0"
type: draw-arrows
prompt: "Acetylacetonate, with − on its middle carbon. Push electrons to move the negative charge onto an oxygen. Either oxygen is fine."
start: acac-enolate
results: [acac-enolate-o3, acac-enolate-o6]
hideTarget: true
answer:
  - { from: a4, to: b3 }
  - { from: b2, to: a3 }
inBetween:
  over: "{atom} has {electrons} e⁻: something has to leave. Both arrows happen at once, so this halfway drawing isn't a real structure."
  short: "{atom} has only {electrons} e⁻. This halfway drawing isn't real either. Fill the gap."
correct: "The charge moved from C4 onto an oxygen, the acetate pattern again. Drawn either way, the − is shared by both O's and the middle carbon."
hints:
  - from: [b2]
    to: [a2]
    text: "Oxygen is the electronegative sink. Pull the π pair toward O, not C."
  - from: [b5]
    to: [a5]
    text: "Oxygen is the electronegative sink. Pull the π pair toward O, not C."
  - from: [a3, a6]
    to: [a2, a5]
    text: "That oxygen has no charge to give. Start from C4, the carbon with the − charge."
  # The spec's example of a second push on the other side (only fires when that push is wrong, i.e. after C4 → C2).
  - from: [b5]
    to: [a6]
    text: "The pair that came into C2 has to push out the C2=O3 pair, the one on the same side."
  - from: [sigma]
    text: σ bonds stay put.
  - text: "One pair in from C4 to make a C=C; one pair out of the C=O beside it, onto O."
reveal: "Arrow from the lone pair on the middle carbon into the C–C bond on its left; arrow from that C=O π bond onto the oxygen. The negative charge is now on oxygen and the double bond is C=C."
sourceNote: "Adapted from LibreTexts, *Map: Organic Chemistry (Wade)*, §1.16 exercise 1-20(f) and its solution in §1.17, CC BY-NC-SA 4.0. Wording and drawing ours. Parent: acetylacetone, PubChem CID 31261."
